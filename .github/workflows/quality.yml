name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stable:
        description: Publish a stable release (main branch only)
        type: boolean
        default: false
      version:
        description: Release version, e.g. 0.1.0 (blank = 0.1.0 preview)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, formatting, lint and APK
        run: ./gradlew :app:spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: python3 scripts/check_repository.py
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  device:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests
          path: app/build/reports/androidTests/
  release:
    needs: [android, device, docs, secrets]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      REQUESTED_VERSION: ${{ inputs.version }}
      STABLE: ${{ inputs.stable || false }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$SIGNING_STORE_FILE" >> "$GITHUB_ENV"
          for key in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing persistent signing secret: $key. See docs/development/releases.md"
              exit 1
            fi
          done
          version="${REQUESTED_VERSION:-0.1.0}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Version must be numeric semver without a prefix'
            exit 1
          fi
          if [ "$STABLE" = true ] && [ -z "$REQUESTED_VERSION" ]; then
            echo '::error::A stable release requires an explicit version'
            exit 1
          fi
          if [ "$STABLE" = true ]; then
            echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$version-pre.$BUILD_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$version-pre.$BUILD_NUMBER" >> "$GITHUB_ENV"
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleRelease
      - name: Verify signature and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/AstrBotMobileUI-$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/AstrBotMobileUI-$VERSION_NAME.apk" > release/signature.txt
          (cd release && sha256sum ./*.apk > SHA256SUMS)
          flags=()
          if [ "$STABLE" != true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "AstrBot Mobile UI $VERSION_NAME" --generate-notes "${flags[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "${SIGNING_STORE_FILE:-$RUNNER_TEMP/release.jks}"
  pages:
    needs: [android, device, docs, secrets]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
