name: Windows signing script
on:
  push:
    paths:
      - scripts/setup-signing.bat
      - scripts/tests/signing-bat.ps1
      - .github/workflows/signing-script.yml
  pull_request:
    paths:
      - scripts/setup-signing.bat
      - scripts/tests/signing-bat.ps1
      - .github/workflows/signing-script.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Windows BAT without uploading real secrets
        shell: powershell
        run: ./scripts/tests/signing-bat.ps1
